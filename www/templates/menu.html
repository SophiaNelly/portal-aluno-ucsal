
<ion-side-menus enable-menu-with-back-views="false">

  <ion-side-menu-content>

    <ion-nav-bar class="bar-positive barra-ucsal">
      <ion-nav-back-button class="button-clear">
        <i class="icon ion-ios-arrow-back"></i> Voltar
      </ion-nav-back-button>
    </ion-nav-bar>

    <ion-nav-view name="menuContent"></ion-nav-view>

  </ion-side-menu-content>

  <ion-side-menu side="left" width="282">

    <ion-header-bar class="bar-positive barra-ucsal">
      <h1 class="title">Portal do Aluno</h1>
    </ion-header-bar>

    <ion-content class="menu-ucsal">

      <div class="menu-perfil">
        <div class="avatar-estudante">
          <i class="icon ion-person"></i>
        </div>

        <strong>{{usuario.nome}}</strong>
        <span>Matrícula {{usuario.matricula}}</span>
      </div>

      <div class="list menu-lista">

        <a class="item item-icon-left"
           ui-sref="app.noticias" menu-close>
          <i class="icon ion-ios-paper-outline"></i>
          Notícias e eventos
        </a>

        <a class="item item-icon-left"
           ui-sref="app.perfil" menu-close>
          <i class="icon ion-ios-person-outline"></i>
          Meu cadastro
        </a>

        <a class="item item-icon-left"
           ui-sref="app.financeiro" menu-close>
          <i class="icon ion-card"></i>
          Financeiro
        </a>

        <a class="item item-icon-left sair-menu"
           ng-click="sair()" menu-close>
          <i class="icon ion-log-out"></i>
          Sair da conta
        </a>

      </div>

      <p class="menu-legenda">
        UCSal • Protótipo acadêmico
      </p>

    </ion-content>

  </ion-side-menu>

</ion-side-menus>
