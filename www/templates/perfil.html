<ion-view view-title="Meu cadastro">
  <ion-nav-buttons side="left">
    <button class="button button-icon button-clear ion-navicon" menu-toggle="left" aria-label="Abrir menu"></button>
  </ion-nav-buttons>
  <ion-content class="fundo-pagina">
    <div class="conteudo-central">
      <section class="titulo-pagina">
        <p class="sobretitulo">SEUS DADOS</p>
        <h2>Atualização cadastral</h2>
        <p>Confira seus dados e mantenha seus contatos atualizados.</p>
      </section>
      <form class="formulario-perfil" name="perfilForm" ng-submit="salvar(perfilForm)" novalidate>
        <div class="card cartao-formulario">
          <div class="item item-divider divisoria-formulario">Dados institucionais <span class="somente-leitura">Somente leitura</span></div>
          <label class="item item-input item-stacked-label">
            <span class="input-label">Nome completo</span>
            <input type="text" ng-model="aluno.nome" ng-disabled="true">
          </label>
          <label class="item item-input item-stacked-label">
            <span class="input-label">Matrícula</span>
            <input type="text" ng-model="aluno.matricula" ng-disabled="true">
          </label>
          <label class="item item-input item-stacked-label">
            <span class="input-label">Curso</span>
            <input type="text" ng-model="aluno.curso" ng-disabled="true">
          </label>
        </div>
        <div class="card cartao-formulario">
          <div class="item item-divider divisoria-formulario">Informações de contato</div>
          <label class="item item-input item-stacked-label">
            <span class="input-label">E-mail pessoal</span>
            <input type="email" name="email" ng-model="aluno.email" placeholder="nome@email.com" required>
          </label>
          <label class="item item-input item-stacked-label">
            <span class="input-label">Telefone / WhatsApp</span>
            <input type="tel" name="telefone" ng-model="aluno.telefone" placeholder="(71) 99999-9999" required>
          </label>
        </div>
        <div class="card cartao-formulario">
          <div class="item item-divider divisoria-formulario">Endereço completo</div>
          <label class="item item-input item-stacked-label">
            <span class="input-label">CEP</span>
            <input type="text" name="cep" ng-model="aluno.endereco.cep" placeholder="00000-000" required>
          </label>
          <label class="item item-input item-stacked-label">
            <span class="input-label">Rua e número</span>
            <input type="text" name="rua" ng-model="aluno.endereco.rua" placeholder="Ex.: Rua das Flores, 120" required>
          </label>
          <label class="item item-input item-stacked-label">
            <span class="input-label">Bairro</span>
            <input type="text" name="bairro" ng-model="aluno.endereco.bairro" placeholder="Seu bairro" required>
          </label>
          <label class="item item-input item-stacked-label">
            <span class="input-label">Cidade</span>
            <input type="text" name="cidade" ng-model="aluno.endereco.cidade" placeholder="Sua cidade" required>
          </label>
        </div>
        <p class="aviso-sucesso" ng-show="salvo"><i class="icon ion-checkmark-circled"></i> Alterações salvas!</p>
        <button class="button button-block botao-primario botao-salvar" type="submit"><i class="icon ion-checkmark"></i> Salvar alterações</button>
        <p class="disclaimer">Os dados são simulados. As mudanças são salvas apenas neste navegador.</p>
      </form>
    </div>
  </ion-content>
</ion-view>
